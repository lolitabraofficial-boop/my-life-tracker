<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --peach:#FFD9C7;
  --peach-deep:#FF9E7A;
  --sage:#CFE3D0;
  --sage-deep:#7FAE84;
  --cream:#FFFBF6;
  --card:#FFFFFF;
  --ink:#4A3F3B;
  --ink-soft:#8A7A73;
  --line:#F0E4DC;
  --pink:#FFC9DE;
  --yellow:#FFE9A8;
  --lav:#DCD3F5;
  --blue:#CFE7F5;
  --danger:#F19191;
  --shadow:0 6px 18px rgba(180,140,110,0.12);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
body{
  height:100%;
  margin:0;
  font-family:'Sarabun',sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --cream:#2B2422; --card:#3A312E; --ink:#F3E9E3; --ink-soft:#C9B8B0; --line:#4A3E3A;
    --peach:#7A4C3A; --peach-deep:#FF9E7A; --sage:#3A4A3D; --sage-deep:#9BD1A0;
    --pink:#5C3A4A; --yellow:#5C4F2C; --lav:#3C3560; --blue:#2C4652;
  }
}
:root[data-theme="dark"]{
  --cream:#2B2422; --card:#3A312E; --ink:#F3E9E3; --ink-soft:#C9B8B0; --line:#4A3E3A;
  --peach:#7A4C3A; --peach-deep:#FF9E7A; --sage:#3A4A3D; --sage-deep:#9BD1A0;
  --pink:#5C3A4A; --yellow:#5C4F2C; --lav:#3C3560; --blue:#2C4652;
}
h1,h2,h3,.brand,.tabbtn,.bignum{font-family:'Baloo 2',sans-serif;}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
header{
  padding:14px 16px 8px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  position:sticky;top:0;z-index:20;background:var(--cream);
  border-bottom:1px solid var(--line);
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.brand{font-size:20px;font-weight:700;color:var(--peach-deep);}
.datepick{font-size:13px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;}
.progress-mini{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabbtn{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;border:none;
  background:var(--card);color:var(--ink-soft);font-weight:600;font-size:14px;
  cursor:pointer;white-space:nowrap;border:1px solid var(--line);
}
.tabbtn.active{background:var(--peach-deep);color:#fff;border-color:var(--peach-deep);}
main{flex:1;padding:8px 16px 100px;overflow-x:hidden;}
.card{
  background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.item{
  display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:none;}
.chk{
  width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:2px solid var(--peach-deep);
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--card);
  font-size:15px;color:transparent;margin-top:1px;
}
.chk.done{background:var(--peach-deep);color:#fff;}
.chk.small{width:20px;height:20px;flex:0 0 20px;border-radius:7px;font-size:12px;}
.item .txt{flex:1;min-width:0;}
.item .ttl{font-weight:600;font-size:14.5px;}
.item .ttl.done{text-decoration:line-through;color:var(--ink-soft);}
.item .sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
.time-badge{font-size:11.5px;color:var(--sage-deep);font-weight:700;background:var(--sage);padding:3px 8px;border-radius:8px;flex:0 0 auto;}
.editbtn{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:4px;flex:0 0 auto;}
.subitem{display:flex;align-items:center;gap:8px;margin-top:8px;padding-left:6px;}
.subitem input[type=number]{
  width:64px;padding:5px 7px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:var(--cream);color:var(--ink);
}
.pillbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.wpill{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--blue);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--ink-soft);
}
.wpill.done{background:var(--blue);color:#20586b;}
.progwrap{background:var(--line);border-radius:999px;height:14px;overflow:hidden;margin-top:6px;}
.progfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--peach-deep),var(--pink));transition:width .3s;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--cream);border-radius:14px;padding:10px 12px;}
.stat .bignum{font-size:20px;font-weight:700;}
.stat .lbl{font-size:11.5px;color:var(--ink-soft);}
button.primary{
  background:var(--peach-deep);color:#fff;border:none;border-radius:12px;padding:10px 16px;font-weight:700;
  font-size:14px;cursor:pointer;font-family:'Sarabun',sans-serif;
}
button.ghost{
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 14px;
  font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Sarabun',sans-serif;
}
input,select,textarea{
  font-family:'Sarabun',sans-serif;background:var(--cream);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;font-size:14px;color:var(--ink);width:100%;
}
label{font-size:12.5px;color:var(--ink-soft);display:block;margin:8px 0 4px;}
.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fbtn{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;}
.fbtn .fname{font-weight:700;font-size:13.5px;}
.fbtn .fmeta{font-size:11.5px;color:var(--ink-soft);margin:2px 0 6px;}
.fbtn .frow{display:flex;gap:6px;align-items:center;}
.fbtn input{width:60px;padding:6px 7px;font-size:12.5px;}
.fbtn button{flex:1;padding:6px;font-size:12px;}
.foodlogitem{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.foodlogitem:last-child{border-bottom:none;}
.del{background:none;border:none;color:var(--danger);font-size:15px;cursor:pointer;}
.fab{
  position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;background:var(--peach-deep);color:#fff;font-size:26px;
  border:none;box-shadow:0 8px 20px rgba(255,120,80,0.4);cursor:pointer;z-index:30;
  max-width:calc(520px - 40px);
}
.modal-bg{
  position:fixed;inset:0;background:rgba(60,40,30,0.35);display:none;align-items:flex-end;justify-content:center;z-index:100;
}
.modal-bg.open{display:flex;}
.modal{
  background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:85vh;overflow-y:auto;
}
.modal h3{margin-top:0;}
.daychk-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.daychk{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--cream);
  display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--ink-soft);
}
.daychk.sel{background:var(--sage-deep);color:#fff;border-color:var(--sage-deep);}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.badge-cat{font-size:10.5px;padding:2px 8px;border-radius:7px;background:var(--lav);color:#4b3f7a;font-weight:700;}
.section-note{font-size:12.5px;color:var(--ink-soft);background:var(--cream);border-radius:10px;padding:8px 10px;margin-bottom:10px;}
.hist{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
.hist:last-child{border-bottom:none;}
.linkbtn{background:none;border:none;color:var(--peach-deep);font-weight:700;font-size:13px;cursor:pointer;}
::-webkit-scrollbar{width:0;height:0;}
.empty{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:16px 0;}
.saved-indicator{font-size:10.5px;color:var(--ink-soft);text-align:right;padding:0 16px 4px;}
.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--cream);padding:8px 16px;border-radius:999px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;max-width:80%;text-align:center;
}
.toast.show{opacity:0.92;}
</style>
</head>

/* ---- Cloud sync via the db capability (upload-only auto; restore is a manual, explicit action) ---- */
let cloudDb=null, cloudUser=null, cloudUid=null, cloudDocRef=null, cloudReady=false, cloudChecked=false;
let cloudHasNewerBackup=false;
let pendingCloudWrite = Promise.resolve();
function queueCloudWrite(){
  if(!cloudDocRef) return;
  pendingCloudWrite = pendingCloudWrite
    .then(()=>cloudDocRef.set({state, savedAt: state.lastSaved||Date.now()}))
    .catch(err=>console.error('cloud save failed', err));
}
function pushToCloud(){ queueCloudWrite(); }
async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) { cloudChecked=true; updateSavedIndicator(); return; }
    cloudDb = await window.claude.use('db');
    cloudUser = await window.claude.use('user');
    if(!cloudDb || !cloudUser){ cloudChecked=true; updateSavedIndicator(); return; }
    cloudUid = await cloudUser.id();
    if(!cloudUid){ cloudChecked=true; updateSavedIndicator(); return; }
    cloudDocRef = cloudDb.doc('data/users/'+cloudUid+'/tracker_state');
    const snap = await cloudDocRef.get();
    cloudReady = true;
    cloudChecked = true;
    if(snap.exists){
      const cloudData = snap.data();
      const cloudSavedAt = (cloudData && cloudData.savedAt) || 0;
      const localSavedAt = state.lastSaved || 0;
      // NEVER auto-overwrite in-memory state. Just flag it so Settings can offer a manual restore.
      if(cloudData && cloudData.state && cloudSavedAt > localSavedAt){
        cloudHasNewerBackup = true;
      } else {
        queueCloudWrite();
      }
    } else {
      queueCloudWrite();
    }
    updateSavedIndicator();
    if(currentTab==='settings') renderMain();
  }catch(e){
    console.error('cloud init failed', e);
    cloudChecked = true;
    updateSavedIndicator();
  }
}
async function restoreFromCloud(){
  if(!cloudDocRef) return;
  try{
    const snap = await cloudDocRef.get();
    if(snap.exists && snap.data() && snap.data().state){
      if(!confirm('กู้คืนข้อมูลจากคลาวด์ จะเขียนทับข้อมูลปัจจุบันในเครื่องนี้ทั้งหมด ต้องการดำเนินการต่อไหม?')) return;
      state = snap.data().state;
      ensureStateDefaults();
      try{ localStorage.setItem('lifeTrackerV1', JSON.stringify(state)); }catch(e){}
      cloudHasNewerBackup = false;
      showToast('กู้คืนข้อมูลจากคลาวด์แล้ว ✓');
      renderTabs(); renderMain(); updateSavedIndicator();
    } else {
      showToast('ไม่พบข้อมูลสำรองบนคลาวด์');
    }
  }catch(e){
    console.error('restore failed', e);
    showToast('กู้คืนไม่สำเร็จ');
  }
}
function save(){
  try{
    state.lastSaved = Date.now();
    localStorage.setItem('lifeTrackerV1', JSON.stringify(state));
    showToast(cloudReady ? 'บันทึกแล้ว ✓ ☁️' : 'บันทึกแล้ว ✓');

  }
  pushToCloud();
}

/* ====================== IF (INTERMITTENT FASTING) TIMER ====================== */
function fmtDur(min){
  min = Math.max(0, Math.round(min));
  const h = Math.floor(min/60), m = min%60;
  return (h>0? h+'ชม ':'') + m+'นาที';
}
function computeIfStatus(now){
  const [sh,sm] = state.settings.ifEatStart.split(':').map(Number);
  const eatStartMin = sh*60+sm;
  const eatDurMin = (state.settings.ifEatHours||6)*60;
  const eatEndMin = eatStartMin + eatDurMin;
  const fastDurMin = 1440 - eatDurMin;
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  if(nowMin >= eatStartMin && nowMin < eatEndMin){
    const elapsed = nowMin - eatStartMin;
    const remaining = eatEndMin - nowMin;
    return {inEating:true, remaining, elapsed, total:eatDurMin, progress:Math.min(1,elapsed/eatDurMin)};
  }
  const nextEatStartMin = nowMin < eatStartMin ? eatStartMin : eatStartMin+1440;
  const lastEatEndMin = nowMin >= eatEndMin ? eatEndMin : eatEndMin-1440;
  const elapsed = nowMin - lastEatEndMin;
  const remaining = nextEatStartMin - nowMin;
  return {inEating:false, remaining, elapsed, total:fastDurMin, progress:Math.min(1,elapsed/fastDurMin)};
}
function renderIfCard(){
  return `<div class="card" id="ifCard">
    <h3>⏱️ Intermittent Fasting</h3>
    <div class="sub" id="ifStatusLine" style="margin-bottom:6px;"></div>
    <div class="progwrap"><div class="progfill" id="ifProgressFill" style="width:0%"></div></div>
    <div class="sub" style="margin-top:6px;" id="ifWindowLine"></div>
  </div>`;
}
function tickIfTimer(){
  const el = document.getElementById('ifCard');

  const st = computeIfStatus(new Date());
  const statusLine = document.getElementById('ifStatusLine');
  const fill = document.getElementById('ifProgressFill');
  const windowLine = document.getElementById('ifWindowLine');
  if(!statusLine||!fill||!windowLine) return;
  if(st.inEating){
    statusLine.innerHTML = `<b style="color:var(--sage-deep);">🍽️ อยู่ในช่วงกิน</b> — ปิดช่วงกินอีก ${fmtDur(st.remaining)}`;

  } else {
    statusLine.innerHTML = `<b style="color:var(--peach-deep);">⏳ อยู่ในช่วงอด</b> — อดมาแล้ว ${fmtDur(st.elapsed)} เริ่มกินได้อีก ${fmtDur(st.remaining)}`;

}

    html += `</div>`;

  document.getElementById('main').innerHTML = `<div class="section-note">แตะวงกลมเพื่อติ๊กว่าทำแล้ว กดดินสอเพื่อแก้เวลา/รายการ กด + ด้านล่างเพื่อเพิ่มรายการใหม่ • งานที่ยังไม่เสร็จในหมวด "เริ่มงาน" กดเลื่อนไปพรุ่งนี้ได้เลย</div>` + (currentDate===fmtDate(new Date()) ? renderIfCard() : '') + renderPcosCard(currentDate) + (html || '<div class="empty">ยังไม่มีรายการของวันนี้</div>');

}

/* ====================== BODY / WEIGHT TAB ====================== */
function renderWeeklySummary(){
  const days = [];
  for(let i=6;i>=0;i--){ days.push(fmtDate(new Date(Date.now()-i*86400000))); }
  let sumPct=0, sumProtein=0, sumWater=0, sleepVals=[], cardioSched=0, cardioDone=0, weightSched=0, weightDone=0, destressDone=0;
  const rows = days.map(d=>{
    const items = scheduleForDay(d);
    const log = state.logs[d];
    const done = log ? items.filter(it=>log.done[it.id]).length : 0;
    const pct = items.length ? Math.round(done/items.length*100) : 0;
    sumPct += pct;
    if(log){
      sumProtein += log.food.reduce((s,f)=>s+f.p,0);
      sumWater += ['w1','w2','w3','w4','w5'].filter(id=>log.done[id]).length;
      if(log.pcosLog && log.pcosLog.sleepHours!=null) sleepVals.push(log.pcosLog.sleepHours);
      if(log.done['destress']) destressDone++;
    }
    if(items.some(it=>it.id==='cardio')){ cardioSched++; if(log && log.done['cardio']) cardioDone++; }
    const wItem = items.find(it=>it.cat==='weight');
    if(wItem){ weightSched++; if(log && log.done[wItem.id]) weightDone++; }
    return {d, pct};
  });
  const avgPct = Math.round(sumPct/7);
  const avgProtein = Math.round(sumProtein/7);
  const avgWater = (sumWater/7).toFixed(1);
  const avgSleep = sleepVals.length ? (sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length).toFixed(1) : '-';
  const rowsHtml = rows.map(r=>`<div class="hist"><span>${r.d}</span><span style="flex:1;margin-left:10px;"><div class="progwrap" style="height:10px;"><div class="progfill" style="width:${r.pct}%"></div></div></span><span style="margin-left:8px;">${r.pct}%</span></div>`).join('');
  return `<div class="card"><h3>📊 สรุป 7 วันล่าสุด</h3>
    <div class="statgrid" style="margin-bottom:12px;">
      <div class="stat"><div class="bignum">${avgPct}%</div><div class="lbl">ทำครบเฉลี่ย/วัน</div></div>
      <div class="stat"><div class="bignum">${avgProtein}g</div><div class="lbl">โปรตีนเฉลี่ย/วัน</div></div>
      <div class="stat"><div class="bignum">${cardioDone}/${cardioSched}</div><div class="lbl">วันคาร์ดิโอที่ทำ</div></div>
      <div class="stat"><div class="bignum">${weightDone}/${weightSched}</div><div class="lbl">วันเวทที่ทำ</div></div>
      <div class="stat"><div class="bignum">${avgWater}/5</div><div class="lbl">แก้วน้ำเฉลี่ย/วัน</div></div>
      <div class="stat"><div class="bignum">${avgSleep}</div><div class="lbl">ชม.นอนเฉลี่ย</div></div>
    </div>
    ${rowsHtml}
  </div>`;
}
function renderBody(){
  const log = ensureLog(currentDate);
  const history = Object.keys(state.logs).filter(d=>state.logs[d].weightKg!=null).sort();
  let chart = '';
  if(history.length>1){
    const vals = history.map(d=>state.logs[d].weightKg);
    const min=Math.min(...vals), max=Math.max(...vals);
    const w=280,h=80,pad=6;
    const pts = vals.map((v,i)=>{
      const x = pad + i*(w-2*pad)/(vals.length-1);
      const y = h-pad - (max===min?h/2:(v-min)/(max-min)*(h-2*pad));
      return `${x},${y}`;
    }).join(' ');
    chart = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:90px;"><polyline points="${pts}" fill="none" stroke="var(--peach-deep)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  let html = renderWeeklySummary() + `<div class="card"><h3>📏 บันทึกวันนี้</h3>
    <label>น้ำหนัก (kg)</label><input type="number" step="0.1" id="wInput" value="${log.weightKg??''}">
    <label>รอบเอว (cm)</label><input type="number" step="0.1" id="waistInput" value="${log.waist??''}">
    <label>รอบสะโพก (cm)</label><input type="number" step="0.1" id="hipInput" value="${log.hip??''}">
    <div style="margin-top:12px;"><button class="primary" id="saveBodyBtn">บันทึก</button></div>
  </div>
  <div class="card"><h3>📈 แนวโน้มน้ำหนัก</h3>${chart||'<div class="empty">บันทึกอย่างน้อย 2 วันเพื่อดูกราฟ</div>'}</div>
  <div class="card"><h3>🗂️ ประวัติ</h3>`;
  if(history.length===0) html += '<div class="empty">ยังไม่มีข้อมูล</div>';
  else history.slice().reverse().slice(0,20).forEach(d=>{
    const l = state.logs[d];
    html += `<div class="hist"><span>${d}</span><span>${l.weightKg??'-'} kg ${l.waist?(' • เอว '+l.waist):''}${l.hip?(' • สะโพก '+l.hip):''}</span></div>`;
  });
  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

/* ====================== ENGLISH TAB ====================== */
function englishLessonFor(dateStr){
  const idx = Math.floor((parseDate(dateStr)-parseDate(PLAN_START))/86400000);
  return ENGLISH_CYCLE[((idx%7)+7)%7];
}
function computeEnglishStreak(){
  const todayStr = fmtDate(new Date());
  const includeToday = !!(state.logs[todayStr] && state.logs[todayStr].english);
  let cursor = new Date();
  if(!includeToday) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(true){
    const ds = fmtDate(cursor);
    if(state.logs[ds] && state.logs[ds].english){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  return {streak, includeToday};
}
function renderEnglish(){
  const log = ensureLog(currentDate);
  const lesson = englishLessonFor(currentDate);
  const {streak, includeToday} = computeEnglishStreak();
  let html = `<div class="card" style="text-align:center;">

      <div class="row"><span style="font-weight:700;">${d.name}</span><button class="editbtn" data-act="editdebt" data-id="${d.id}">✏️</button></div>

      <div class="progwrap" style="margin-top:6px;"><div class="progfill" style="width:${pct}%"></div></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="ghost" data-act="paydebt" data-id="${d.id}">✅ บันทึกจ่ายเดือนนี้ (-${d.monthlyPayment.toLocaleString()})</button>

  html += `<button class="ghost" id="addDebtBtn">➕ เพิ่มหนี้ใหม่</button></div>`;

  });
  if(state.recurringExpenses.length===0) html += '<div class="empty">ยังไม่มีค่าใช้จ่ายประจำ</div>';
  html += `<div style="margin-top:8px;"><button class="ghost" id="addExpenseBtn">➕ เพิ่มค่าใช้จ่าย</button></div></div>`;

  const all = [];
  Object.keys(state.logs).forEach(d=>{ (state.logs[d].finance||[]).forEach(f=>all.push({...f,date:d})); });
  all.sort((a,b)=>b.date.localeCompare(a.date));
  const incomeAdhoc = all.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);
  const expenseAdhoc = all.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);
  html += `<div class="card"><h3>📝 ธุรกรรมเพิ่มเติม</h3>
    <div class="statgrid">
      <div class="stat"><div class="bignum">+${incomeAdhoc.toLocaleString()}</div><div class="lbl">รายรับเพิ่มเติม</div></div>
      <div class="stat"><div class="bignum">-${expenseAdhoc.toLocaleString()}</div><div class="lbl">รายจ่ายเพิ่มเติม</div></div>
    </div>
    <label style="margin-top:10px;">ประเภท</label>
    <select id="finType"><option value="expense">รายจ่าย</option><option value="income">รายรับ</option></select>
    <label>จำนวนเงิน (บาท)</label><input type="number" id="finAmount">
    <label>รายละเอียด</label><input type="text" id="finNote">
    <div style="margin-top:10px;"><button class="primary" id="addFinBtn">บันทึก</button></div>
  </div>
  <div class="card"><h3>🗂️ ประวัติล่าสุด</h3>`;
  if(all.length===0) html += '<div class="empty">ยังไม่มีรายการ</div>';
  else all.slice(0,25).forEach(f=>{ html += `<div class="hist"><span>${f.date} • ${f.note||'-'}</span><span style="color:${f.type==='income'?'var(--sage-deep)':'var(--danger)'}">${f.type==='income'?'+':'-'}${f.amount.toLocaleString()}</span></div>`; });
  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

    <label>หมวดหมู่</label>

    <div class="daychk-row" id="dayRow">
      <div class="daychk ${isAll?'sel':''}" data-day="all">ทุกวัน</div>
      ${DAY_ORDER.map(d=>`<div class="daychk ${(!isAll&&Array.isArray(selDays)&&selDays.includes(d))?'sel':''}" data-day="${d}">${DAY_LABELS[d]}</div>`).join('')}
    </div>
    <label>หมายเหตุ (ถ้ามี)</label><input type="text" id="mNotes" value="${it&&it.notes?it.notes.replace(/"/g,'&quot;'):''}">
    <div class="modal-actions">
      <button class="primary" id="mSave">บันทึก</button>
      ${it?'<button class="ghost" id="mDelete" style="color:var(--danger);">ลบ</button>':''}
      <button class="ghost" id="mCancel">ยกเลิก</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('open');
  const dayRow = document.getElementById('dayRow');
  dayRow.querySelectorAll('.daychk').forEach(el=>{
    el.onclick = ()=>{
      if(el.dataset.day==='all'){
        dayRow.querySelectorAll('.daychk').forEach(x=>x.classList.remove('sel'));
        el.classList.add('sel');
      } else {
        dayRow.querySelector('[data-day="all"]').classList.remove('sel');
        el.classList.toggle('sel');
      }
    };
  });

  if(it) document.getElementById('mDelete').onclick = ()=>{
    state.schedule = state.schedule.filter(x=>x.id!==it.id); save(); closeModal(); renderMain();
  };
  document.getElementById('mSave').onclick = ()=>{
    const title = document.getElementById('mTitle').value.trim();
    if(!title) return;
    const time = document.getElementById('mTime').value || '08:00';
    const cat = document.getElementById('mCat').value;
    const notes = document.getElementById('mNotes').value.trim();
    const selected = Array.from(dayRow.querySelectorAll('.daychk.sel')).map(x=>x.dataset.day);
    const days = (selected.length===0 || selected.includes('all')) ? 'all' : selected;
    if(it){
      it.title=title; it.time=time; it.cat=cat; it.notes=notes||undefined; it.days=days;
    } else {
      state.schedule.push({id:'custom_'+Date.now(), title, time, cat, notes:notes||undefined, days});
    }
    save(); closeModal(); renderMain();
  };
}

    </div>

    }

  };

/* ====================== EVENT DELEGATION ====================== */
document.getElementById('main').addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const log = ensureLog(currentDate);
  if(act==='toggle'){ const id=el.dataset.id; log.done[id]=!log.done[id]; save(); renderMain(); }
  else if(act==='subtoggle'){
    const id=el.dataset.id, sub=el.dataset.sub;
    if(!log.subDone[id]) log.subDone[id]={};
    log.subDone[id][sub] = !log.subDone[id][sub];
    save(); renderMain();
  }
  else if(act==='edit'){ openItemModal(el.dataset.id); }
  else if(act==='deleteitem'){ state.schedule = state.schedule.filter(x=>x.id!==el.dataset.id); save(); renderMain(); }
  else if(act==='engtoggle'){ log.english=!log.english; save(); renderMain(); }
  else if(act==='delspeak'){ log.speaking.splice(parseInt(el.dataset.idx),1); save(); renderMain(); }
  else if(act==='vocabtoggle'){ const id=el.dataset.id; log.vocabReviewed[id]=!log.vocabReviewed[id]; save(); renderMain(); }
  else if(act==='delvocab'){ state.vocab = state.vocab.filter(v=>v.id!==el.dataset.id); save(); renderMain(); }
  else if(act==='editdebt'){ openDebtModal(el.dataset.id); }
  else if(act==='deldebt'){ state.debts = state.debts.filter(d=>d.id!==el.dataset.id); save(); renderMain(); }
  else if(act==='paydebt'){
    const d = state.debts.find(x=>x.id===el.dataset.id);
    if(d){
      d.remaining = Math.max(0, d.remaining - d.monthlyPayment);
      if(!d.payments) d.payments=[];
      d.payments.push({date:currentDate, amount:d.monthlyPayment});
      save(); renderMain();
    }
  }
  else if(act==='editexpense'){ openExpenseModal(el.dataset.id); }
  else if(act==='delexpense'){ state.recurringExpenses = state.recurringExpenses.filter(e=>e.id!==el.dataset.id); save(); renderMain(); }
  else if(act==='tasktoggle'){ const idx=parseInt(el.dataset.idx); if(log.tasks[idx]) log.tasks[idx].done=!log.tasks[idx].done; save(); renderMain(); }
  else if(act==='deltask'){ log.tasks.splice(parseInt(el.dataset.idx),1); save(); renderMain(); }
  else if(act==='rolltasks'){
    const tomorrow = fmtDate(new Date(parseDate(currentDate).getTime()+86400000));
    const tLog = ensureLog(tomorrow);
    const remaining = [];
    log.tasks.forEach(t=>{ if(t.done) remaining.push(t); else tLog.tasks.push({text:t.text, done:false, movedFrom:currentDate}); });
    log.tasks = remaining;
    save(); renderMain();
  }
  else if(act==='addfood'){
    const fid = el.dataset.id; const f = state.foodDb.find(x=>x.id===fid);
    const qtyEl = document.querySelector(`[data-qty="${fid}"]`);
    const qty = parseFloat(qtyEl.value)||f.def;
    const macros = foodMacros(f, qty);
    log.food.push({name:f.name, qty, unit:f.unit, p: macros.p, c: macros.c});
    save(); renderMain();
  }
  else if(act==='editfooditem'){ openFoodModal(el.dataset.id); }
  else if(act==='delfood'){ log.food.splice(parseInt(el.dataset.idx),1); save(); renderMain(); }
});

    log.hip = parseFloat(document.getElementById('hipInput').value)||null;
    save(); renderMain();
  }
  if(e.target.id==='addTaskBtn'){
    const inp = document.getElementById('taskInput');
    const val = inp.value.trim();
    if(val){ const log = ensureLog(currentDate); log.tasks.push({text:val, done:false}); save(); renderMain(); }
  }
  if(e.target.id==='addSpeakBtn'){
    const topic = document.getElementById('speakTopic').value.trim();
    const confidence = parseInt(document.getElementById('speakConfidence').value)||3;
    if(topic){ const log = ensureLog(currentDate); log.speaking.push({topic, confidence}); save(); renderMain(); }
  }
  if(e.target.id==='addVocabBtn'){
    const word = document.getElementById('vocabWord').value.trim();
    const meaning = document.getElementById('vocabMeaning').value.trim();
    if(word && meaning){ state.vocab.push({id:'vocab_'+Date.now(), word, meaning}); save(); renderMain(); }
  }
  if(e.target.id==='addDebtBtn'){ openDebtModal(null); }
  if(e.target.id==='addExpenseBtn'){ openExpenseModal(null); }
  if(e.target.id==='saveIncomeBtn'){
    state.monthlyIncome = parseFloat(document.getElementById('incomeInput').value)||0;
    save(); renderMain();
  }
  if(e.target.id==='savePcosBtn'){
    const log = ensureLog(currentDate);
    log.pcosLog.sleepHours = parseFloat(document.getElementById('pcosSleep').value);
    if(isNaN(log.pcosLog.sleepHours)) log.pcosLog.sleepHours = null;
    log.pcosLog.mood = document.getElementById('pcosMood').value;
    log.pcosLog.note = document.getElementById('pcosNote').value.trim();
    save(); renderMain();
  }
  if(e.target.id==='addFinBtn'){
    const type = document.getElementById('finType').value;
    const amount = parseFloat(document.getElementById('finAmount').value);
    const note = document.getElementById('finNote').value.trim();
    if(amount>0){ const log = ensureLog(currentDate); log.finance.push({type,amount,note}); save(); renderMain(); }
  }
  if(e.target.id==='saveSettingsBtn'){
    state.settings.proteinTarget = parseFloat(document.getElementById('setProtein').value)||135;
    state.settings.calorieTarget = parseFloat(document.getElementById('setCal').value)||1450;
    save(); renderMain();
  }
  if(e.target.id==='saveIfBtn'){
    state.settings.ifEatStart = document.getElementById('setIfStart').value || '09:00';
    state.settings.ifEatHours = parseFloat(document.getElementById('setIfHours').value)||6;
    save(); renderMain();
  }
  if(e.target.id==='restoreCloudBtn'){ restoreFromCloud(); }
});
document.getElementById('dateInput').addEventListener('change', e=>{ currentDate = e.target.value; renderMain(); });
document.getElementById('fabBtn').addEventListener('click', ()=> openItemModal(null));

/* ====================== INIT ====================== */
renderTabs();
renderMain();
updateSavedIndicator();
initCloud();
</script>
</body>
